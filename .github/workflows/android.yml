name: Android build

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Lint and build installable APK
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Prepare release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/MimoChat-v1.1.0.apk
          sha256sum release/MimoChat-v1.1.0.apk > release/MimoChat-v1.1.0.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MimoChat-v1.1.0
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 release/* --clobber
          else
            gh release create v1.1.0 release/* --target "$GITHUB_SHA" --title "Mimo Chat v1.1.0" --notes "Online companion preview: uploaded portraits, separate Companion/Roleplay histories, editable sourced memories, older-message retrieval and streaming replies. Debug-signed testing APK; device and live-model evaluation pending."
          fi

